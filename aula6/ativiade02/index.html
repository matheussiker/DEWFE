<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site usando bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand" href="#">Home</span>
                <a class="nav-link text-white" href="contato.html">Contato</a>
                <a class="nav-link text-white" href="sobre.html">Sobre</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="row justify-content-around mt-5">
                <div class="card col-12 col-md-6 col-lg-3">
                    <div class="card-body">
                        <h5 class="card-title">Iphone 17 Pro Max</h5>
                        <p class="card-text">Descrição</p>
                        <a href="17promax.html" class="btn btn-primary">Mais detalhes</a>
                    </div>
                </div>
                <div class="card col-12 col-md-6 col-lg-3">
                    <div class="card-body">
                        <h5 class="card-title">Iphone 17 Pro</h5>
                        <p class="card-text">Descrição</p>
                        <a href="17pro.html" class="btn btn-primary">Mais detalhes</a>
                    </div>
                </div>
                <div class="card col-12 col-md-6 col-lg-3">
                    <div class="card-body">
                        <h5 class="card-title">Iphone 17</h5>
                        <p class="card-text">Descrição</p>
                        <a href="17basic.html" class="btn btn-primary">Mais detalhes</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mt-5 ">
            <div class="card p-4 col-12">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" placeholder="Digite seu nome">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" placeholder="Digite seu e-mail">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensagem</label>
                        <textarea class="form-control" rows="4" placeholder="Digite sua mensagem"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Enviar
                    </button>
                    <button type="reset" class="btn btn-danger mt-3 w-100">
                        Limpar
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
